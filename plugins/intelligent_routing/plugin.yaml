name: intelligent_routing
version: "0.2.0"
description: >-
  Opt-in cost routing by task type. When enabled per agent (routing.intelligent:
  true, default OFF), each turn is classified by what it is: cheap-safe work
  (lookups, formatting, summaries, board toggles) goes to routing.cheap_model
  (default deepseek/deepseek-v4-flash-0731 via OpenRouter); code, design,
  judgment, public writing, sensitive and side-effect work stays on the primary.
  Also provides the task-routing delegation backend (delegation.backend:
  task-routing) that routes each subagent the same way, escalation of failed,
  empty or refused cheap turns back to the primary, and an optional
  llm-router mode for turns the heuristic cannot decide.
author: NimbleCo
hooks:
  - pre_llm_call
